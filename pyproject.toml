[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vools"
dynamic = ["version"]
authors = [
    { name = "Victor", email = "victortop921129@gmail.com" },
]
description = "Python 函数式编程工具集"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.6"
dependencies = [
    # py3.6 没有标准库 dataclasses，vools/core/dataclass_compat.py 回退到 attrs 包。
    # py3.7+ 用标准库 dataclasses，无需额外依赖（vools 主体保持零强制依赖）。
    "attrs>=20.3,<23; python_version < '3.7'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
serialize = [
    "msgpack>=1.0",
    "orjson>=3.9",
]
# vools.data.vtext 的 fernet/aes 加密依赖 cryptography。
# 生产用 pyk/configs.encrypt_secret(way="fernet") 加密 PG 等密文时必须装这个 extra。
security = ["cryptography>=41.0"]
rx = ["vools-rx==0.7.6"]
# vools.bridge.md 实际由 vools-bridges 分发：`vools-bridge-md`(0.5.0) 从未发布到 PyPI
# （实测 pypi.org/pypi/vools-bridge-md/json → 404），照原名 pin 会让 vools[bridge-md]
# 和 vools[all] 一起装不出来。这一项改成指向真正携带该模块的包。
# 0.7.9：extras 是**精确 pin**，钉旧版会把"装得上但用不了"的组合发出去 ——
# vools-actus 0.7.9 的 validate 要 `is_routable`，而 0.7.8 的 bridges 没有这个符号。
bridges = ["vools-bridges==0.7.9"]
bridge-md = ["vools-bridges==0.7.9"]
# actus 从未发布过 0.7.0（打包元数据坏在 [tool.setuptools.dynamic]，wheel 永远停在 0.7.0
# 且没人传过），这里的 ==0.7.0 是悬空 pin。随 0.7.8 一起修正。
actus = ["vools-actus==0.7.9"]
dll32 = ["vools-dll32==0.7.6"]
xl = ["vools-xl==0.7.6"]
all = [
    "vools-rx==0.7.6",
    "vools-bridges==0.7.9",
    "vools-actus==0.7.9",
    "vools-dll32==0.7.6",
    "vools-xl==0.7.6",
    "vools-pyk==0.1.1",
]
cli = [
    "typer>=0.12.0",
    "typing-extensions>=4.0.0",
    "fire>=0.5.0",
]
# pyk 子包（pyspark / PostgreSQL 集成）作为独立分发包 vools-pyk 分发：
#   仓库子目录 pyk/，namespace 包 vools/pyk/（安装后并入 vools 命名空间）。
# 安装方式：pip install 'vools[pyk]'（自动拉 vools-pyk + pyspark + pandas + numpy）
# 或直接 pip install vools-pyk。
# 核心库 vools 不再携带 vools/pyk/ 目录，保持轻量。
pyk = ["vools-pyk==0.1.1"]
# 兼容旧指令：只想拿 pyspark 运行时（不一定装 vools-pyk 全套 API）用这个。
spark = [
    "pyspark>=2.4.3",
    "pandas>=0.24",
    "numpy>=1.16",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-minify-plugin>=0.8",
]

[project.scripts]
vools = "vools.__main__:main"

[project.urls]
"Homepage" = "https://github.com/vicTop-cw/vools"
"Repository" = "https://github.com/vicTop-cw/vools"
"Issues" = "https://github.com/vicTop-cw/vools/issues"

# ============ setuptools: 自动发现所有包 ============
[tool.setuptools.packages.find]
include = ["vools*"]
exclude = [
    "vools.__pycache__",
    "vools.*.__pycache__",
    "vools.dll32*",
    "vools.xl*",
    "vools.bridge*",
    "vools.actus*",
    "vools.reactive*",
    "vools.pyk*",
]

[tool.setuptools.dynamic]
version = { attr = "vools.__version__" }

[tool.setuptools.package-data]
"vools" = [
    "config.template.py",
    "*.md",
    "lib/*.dll",
    "lib/*.so",
    "lib/windows/*.dll",
    "lib/linux/*.so",
    "data/*.dll",
    "data/*.so",
]

# ============ pytest ============
[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认运行纯 Python 核心测试：functional, decorators, data, curried, oop, core, serialize, task, datetime, utils
# 默认不运行（需要外部资源/平台特定）：dll32, xl, monitoring, benchmarks, archive, other
# 如需运行全部测试，使用: pytest --override-ini="addopts=--tb=short -q"
# 如需运行特定子项目测试，使用: pytest bridges/tests/ 或 pytest rx/tests/
# 让未注册标记直接失败，杜绝"标记名写对但无人实现"的静默空守卫
addopts = "--tb=short -q --strict-markers --ignore=tests/monitoring --ignore=tests/benchmarks --ignore=tests/archive --ignore=tests/other --ignore=tests/__rust__ --ignore=tests/__persist__ --ignore=tests/__pycache__"
markers = [
    "integration: 标记集成测试（依赖外部资源，如剪贴板、文件系统、键鼠）",
    "windows_only: 仅在 Windows 上可运行的测试",
    "slow: 运行较慢的测试",
    "asyncio: 标记异步测试",
    # BUG-4：本仓曾用 @pytest.mark.flaky(reruns=N) 兜底计时抖动，但既没注册这个标记、
    # 也没声明 pytest-rerunfailures —— 标记被 pytest 当未知标记静默忽略，reruns 从未
    # 生效（套件随机红绿）。注册后：装了 pytest-rerunfailures 就真重试；没装则
    # --strict-markers 下会明确报错，而不是继续"看起来有守卫"。
    "flaky: 允许重试的不稳定用例（需 pytest-rerunfailures 才真正生效）",
]
asyncio_mode = "auto"

# ============ coverage ============
[tool.coverage.run]
source = ["vools"]
omit = [
    "vools/__main__.py",
    "vools/*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

# ============ black ============
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除第三方或生成目录
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | build
  | dist
  | Temp
  | debug
  | dev_tools
)/
'''

# ============ isort ============
[tool.isort]
profile = "black"
line-length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["__pycache__", ".venv", "build", "dist", ".git", ".pytest_cache", ".mypy_cache", "Temp", "debug", "dev_tools"]

# ============ flake8 ============
[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "Temp",
    "debug",
    "dev_tools",
    ".trae",
    ".workbuddy",
]

# ============ mypy ============
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    'Temp/',
    'debug/',
    'dev_tools/',
    'analysis/',
    'guide/',
    'examples/',
    'autopypi/',
    'changelog/',
    '.workbuddy/',
    '.trae/',
    '.atomcode/',
    '.run/',
    'tests/',
]

[[tool.mypy.overrides]]
module = "vools.*"
disallow_untyped_defs = false

# ============ MANIFEST.in 等效: 明确 dist 包含内容 ============
# 此处省略 MANIFEST.in；setuptools 默认会包含 README.md / LICENSE / pyproject.toml
