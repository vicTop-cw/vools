[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vools"
dynamic = ["version"]
authors = [
    { name = "Victor", email = "victortop921129@gmail.com" },
]
description = "Python 函数式编程工具集"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.6"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
serialize = [
    "msgpack>=1.0",
    "orjson>=3.9",
]
rx = ["vools-rx==0.7.5"]
bridges = ["vools-bridges==0.7.5"]
dll32 = ["vools-dll32==0.7.5"]
xl = ["vools-xl==0.7.5"]
all = ["vools-rx==0.7.5", "vools-bridges==0.7.5", "vools-dll32==0.7.5", "vools-xl==0.7.5"]
cli = [
    "typer>=0.12.0",
    "typing-extensions>=4.0.0",
    "fire>=0.5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-minify-plugin>=0.8",
]

[project.scripts]
vools = "vools.__main__:main"

[project.urls]
"Homepage" = "https://github.com/vicTop-cw/vools"
"Repository" = "https://github.com/vicTop-cw/vools"
"Issues" = "https://github.com/vicTop-cw/vools/issues"

# ============ setuptools: 自动发现所有包 ============
[tool.setuptools.packages.find]
include = ["vools*"]
exclude = [
    "vools.__pycache__",
    "vools.*.__pycache__",
    "vools.dll32*",
    "vools.xl*",
    "vools.bridge*",
    "vools.reactive*",
]

[tool.setuptools.dynamic]
version = { attr = "vools.__version__" }

[tool.setuptools.package-data]
"vools" = [
    "config.template.py",
    "*.md",
    "lib/*.dll",
    "lib/*.so",
    "lib/windows/*.dll",
    "lib/linux/*.so",
    "data/*.dll",
    "data/*.so",
]

# ============ pytest ============
[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认运行纯 Python 核心测试：functional, decorators, data, curried, oop, core, serialize, task, datetime, utils
# 默认不运行（需要外部资源/平台特定）：dll32, xl, monitoring, benchmarks, archive, other
# 如需运行全部测试，使用: pytest --override-ini="addopts=--tb=short -q"
# 如需运行特定子项目测试，使用: pytest bridges/tests/ 或 pytest rx/tests/
addopts = "--tb=short -q --ignore=tests/monitoring --ignore=tests/benchmarks --ignore=tests/archive --ignore=tests/other --ignore=tests/__rust__ --ignore=tests/__persist__ --ignore=tests/__pycache__"
markers = [
    "integration: 标记集成测试（依赖外部资源，如剪贴板、文件系统、键鼠）",
    "windows_only: 仅在 Windows 上可运行的测试",
    "slow: 运行较慢的测试",
    "asyncio: 标记异步测试",
]
asyncio_mode = "auto"

# ============ coverage ============
[tool.coverage.run]
source = ["vools"]
omit = [
    "vools/__main__.py",
    "vools/*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

# ============ black ============
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除第三方或生成目录
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | build
  | dist
  | Temp
  | debug
  | dev_tools
)/
'''

# ============ isort ============
[tool.isort]
profile = "black"
line-length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["__pycache__", ".venv", "build", "dist", ".git", ".pytest_cache", ".mypy_cache", "Temp", "debug", "dev_tools"]

# ============ flake8 ============
[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "Temp",
    "debug",
    "dev_tools",
    ".trae",
    ".workbuddy",
]

# ============ mypy ============
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    'Temp/',
    'debug/',
    'dev_tools/',
    'analysis/',
    'guide/',
    'examples/',
    'autopypi/',
    'changelog/',
    '.workbuddy/',
    '.trae/',
    '.atomcode/',
    '.run/',
    'tests/',
]

[[tool.mypy.overrides]]
module = "vools.*"
disallow_untyped_defs = false

# ============ MANIFEST.in 等效: 明确 dist 包含内容 ============
# 此处省略 MANIFEST.in；setuptools 默认会包含 README.md / LICENSE / pyproject.toml
