[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vools-bridges"
# 0.7.9：runner 新增 is_routable / known_languages / reset_known_languages 与
# sigma 族语言标记（docs/41 §A1）。vools-actus 0.7.9 的 validate 依赖 is_routable，
# 所以这一版必须与它同批发布。
version = "0.9.0"
authors = [
    { name = "Victor", email = "victortop921129@gmail.com" },
]
description = "vools 跨语言桥接子包"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"
dependencies = [
    "vools>=0.9.0",
]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
exclude = ["webview2\\.py$"]

[tool.setuptools.packages.find]
include = ["vools.bridge*"]

[tool.setuptools.package-data]
"vools.bridge" = [
    "README.md",
    "*/README.md",
    "freebasic/compiler/expand/*.txt",
    "freebasic/inc/**/*.bi",
    "freebasic/libs/win64/gui/*.a",
    "freebasic/libs/win64/gui/*.json",
    "freebasic/modules/*.bas",
    "nim/*.nim",
    "nim/*.bat",
    "nim/*.sh",
    "nim/operators/*.nim",
    "nim/operators/*.bat",
    "rust/safe_eval/**/*",
    "scala/operators/*.scala",
    "scala/operators/*.bat",
    "scala/operators/*.jar",
    "kotlin/operators/*.kt",
    "kotlin/operators/*.bat",
    "csharp/api/**/*.py",
    "vbnet/api/**/*.py",
]
