[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vools-actus"
# 单一真源：静态版本。此前这里写死 0.7.0，同时又在 [tool.setuptools.dynamic]
# 里声明 version = {attr = "vools.actus.__version__"}，而 [project] 没有
# dynamic = ["version"]、包里也没有 __version__ —— setuptools 直接忽略 dynamic 段，
# 打出来的 wheel 永远停在 0.7.0。对齐主包 vools 0.7.7 提到 0.7.8。
# 0.7.9：docs/41 的 sigma / scattered / repo / publisher 四个模块此前**从未进过
# 任何已发布的 wheel**（0.7.8 发布于 09-27，那四个模块是 10-12 才写的），
# 所以本地源码与 PyPI 上的 0.7.8 内容并不相同 —— 必须靠版本号区分。
version = "0.8.0"
authors = [
    { name = "Victor", email = "victortop921129@gmail.com" },
]
description = "Actus 动作引擎 - 工作流自动化与动作编排"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# 真实最低 3.7：publisher/repo/scattered/semver/sigma 使用了 PEP 563
# `from __future__ import annotations`（3.7 引入）。核心 vools 仍支持 3.6，
# 但 vools-actus 早已不支持；声明 >=3.6 会让 3.6 用户 pip 装上即 SyntaxError。
requires-python = ">=3.7"
dependencies = [
    "vools>=0.7.0",
    # 引擎不止 mdtest 需要 vools.bridge：model.parse_cfg()（加载任何一条动作都要走）
    # 与 executor 的逐块执行都 import vools.bridge.md.*。这些符号来自已发布的
    # vools-bridges（主包 vools 只把它放在 [bridges] extras 里，装了 vools 也没有），
    # 所以必须是硬依赖。
    # 下限 0.7.7：mdtest.py 直取 `_build_prelude_env`，实测已发布的 0.7.6 wheel 里
    # 没有这个符号（解包 grep vools/bridge/md/runner.py = 0），装 0.7.6 会让
    # `import vools.actus.mdtest` 直接 ImportError。
    # 下限抬到 0.7.9：`validate.check_block_languages()` 走
    # `vools.bridge.md.runner.is_routable`，而实测已发布的 **0.7.8 wheel 里没有这个符号**
    # （装 0.7.8 后 `from vools.bridge.md.runner import is_routable` 直接 ImportError）。
    # 钉 0.7.7/0.7.8 都会让"装得上但校验一跑就炸"的组合被解析出来。
    "vools-bridges>=0.7.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]
cli = [
    "typer>=0.12.0",
    "typing-extensions>=4.0.0",
    "fire>=0.5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-minify-plugin>=0.8",
]
serialize = [
    "msgpack>=1.0",
    "orjson>=3.9",
]
# vools.actus.desktop 在【模块顶层】import fastapi（uvicorn 在 start() 内），
# 此前这三样在 dependencies / 任何 extra 里都没声明（2026-10-17 审计：全文件
# grep fastapi|uvicorn|jinja = 0）——`pip install vools-actus` 之后
# import vools.actus.desktop 必 ModuleNotFoundError，且【没有任何 extra 能补救】，
# 只能手 pip。与本仓惯例相违（typer→cli、cryptography→security、pandas→pyk 的
# [spark]）。补 desktop extra：fastapi 提供 app 与 Jinja2Templates（后者运行期
# 需要 jinja2），uvicorn 是 start() 的服务器。下限取仍支持 requires-python
# (>=3.7) 的版本，新版 pip 会各自挑兼容解析。
desktop = [
    "fastapi>=0.68",
    "uvicorn>=0.13",
    "jinja2>=2.11",
]

[project.scripts]
actus = "vools.actus.cli:main"

[project.urls]
"Homepage" = "https://github.com/vicTop-cw/vools"
"Repository" = "https://github.com/vicTop-cw/vools"
"Issues" = "https://github.com/vicTop-cw/vools/issues"

# ============ setuptools: 自动发现所有包 ============
[tool.setuptools.packages.find]
include = ["vools*"]

[tool.setuptools.package-data]
"vools.actus" = [
    "config.template.py",
    "*.md",
    "templates/*",
    "static/*",
    # 种子动作（三层动作边界的第 1 层，docs/08 §1）：
    # vools/actus/actions/**/*.actus.md + *.actus.schema.md 随 wheel 分发，
    # pip 装上即有 4 个基线 GUI 动作（此前只收 *.md 与 vools/actus/ 直属层，
    #   basics/ 下的 .actus.schema.md 进不了 wheel，装上后索引恒空）。
    "actions/*.actus.md",
    "actions/*.actus.schema.md",
    "actions/**/*.actus.md",
    "actions/**/*.actus.schema.md",
    # _shiki/：highlight.py 的 SHIKI_SCRIPT 指向 _shiki/render.mjs（Shiki 高亮）。
    # 此前 package-data 未包含它，wheel 落盘后 render.mjs 缺失，
    # `check_shiki_available()` 恒为 False（与"迁移漏搬 bundle"同族缺陷，只是发生在打包层）。
    # 只带 .mjs/.json（render.mjs + package.json + package-lock.json，~26KB）；
    # node_modules/（14.3MB）不入 wheel —— 缺 node_modules 时 check_shiki_available()
    # 返回 False，高亮降级到兜底着色（优雅降级，不硬失败）。
    "_shiki/*.mjs",
    "_shiki/*.json",
    # schemas/*.json：adapter.py 的 JSON Schema 校验在源树走
    # `<repo-root>/contracts/adapter.schema.json`，但 `contracts/` 位于包外，
    # wheel 不会安装它 —— 装完后 schema_path 不存在、校验静默跳过（同族缺陷）。
    # 包内 schemas/ 副本随 wheel 安装，adapter.py 优先用包内、回退源树 contracts/。
    "schemas/*.json",
]

# ============ pytest ============
[tool.pytest.ini_options]
testpaths = ["tests"]
# manual_gui/ 是需要真实桌面（WebView2/CEF/pywebview）+ 人工观察的手动脚本，
# 用 spec_from_file_location 顶层加载、headless 环境必然收集失败，不进自动套件；
# 需要时在本机直接 `python tests/manual_gui/xxx.py` 运行。
norecursedirs = [".*", "manual_gui"]
addopts = "--tb=short -q"
markers = [
    "integration: 标记集成测试（依赖外部资源，如剪贴板、文件系统、键鼠）",
    "windows_only: 仅在 Windows 上可运行的测试",
    "slow: 运行较慢的测试",
    "asyncio: 标记异步测试",
]
asyncio_mode = "auto"

# ============ coverage ============
[tool.coverage.run]
source = ["vools.actus"]
omit = [
    "vools/actus/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

# ============ black ============
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除第三方或生成目录
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | build
  | dist
  | Temp
  | debug
  | dev_tools
)/
'''

# ============ isort ============
[tool.isort]
profile = "black"
line-length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

# ============ flake8 ============
[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "Temp",
    "debug",
    "dev_tools",
]

# ============ mypy ============
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
ignore_missing_imports = true

# ============ ruff ============
# 2026-10-21 vools-actus CI 基建（ruff 0.17.0 实测）：
# 当前门槛 = "硬错误"规则集 select=E4/E7/E9（import/语句/语法-运行时错误），
# vools/actus + tests/ 合计 0 违规，CI 绿。其余 E711-E743（==None /
# isinstance(str) / lambda 赋值等）与 E9xx 全部生效。
#
# 5 个 ignore 对应存量 140 处"风格"违规（2026-10-21 实测明细）：
#   E401  1   一行多导入（ai/routing.py:13）
#   E402  83  模块导入不在文件顶部（全部在 tests/：_ai_local_bootstrap.install()
#             必须先于业务导入执行，是本套件依赖的既定模式）
#   E701  27  单行 if: return（ai/routing.py、workflow.py 紧凑风格）
#   E702  19  一行多语句（同上）
#   E741  10  歧义循环变量 `l`（sigma.py / workflow.py / tests）
#
# ruff 0.17 默认全规则集实测 2625 违规（UP006 798 / BLE001 265 / RUF013 257 /
# UP045 222 / I001 206 / F401 173 / UP035 146 / UP031 116 / S110 77 /
# RUF022 58 / F541 45 / RUF100 32 / …），全部风格级；另有 22 处 F821
# 未定义名（cli.py `os` ×18 / mcp_server.py `ProjectOrchestrator` /
# panel.py `e` / trust_model.py `evaluate`）疑似真实缺陷，详见
# vools-actus-ci-implementation-report.md。
# actus 源码并行修改中，风格清理 + F821 修复由主 Agent 另行专项，之后分档扩面：
#   +F401/F841 → +I001 → +E501（line-length=120）→ UP 系列。
[tool.ruff]
line-length = 120
target-version = "py37"
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "Temp",
    "debug",
    "dev_tools",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9"]
ignore = ["E401", "E402", "E701", "E702", "E741"]
