repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120"]

  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: python -m pytest tests/test_reactive.py tests/test_recorder.py tests/test_box.py -x
        language: system
        pass_filenames: false
        always_run: true