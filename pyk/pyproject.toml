[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vools-pyk"
version = "0.1.1"
authors = [
    { name = "Victor", email = "victortop921129@gmail.com" },
]
description = "vools 的 PySpark / PostgreSQL 集成子包（独立分发）"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.6"
# pyk 是独立分发包：安装后作为 vools 命名空间下的 vools.pyk 出现（配合 vools 的
# pkgutil.extend_path namespace package）。核心依赖：vools + pyspark + pandas + numpy。
dependencies = [
    "vools>=0.7.8",
    "pyspark>=2.4.3",
    "pandas>=0.24",
    "numpy>=1.16",
]

[project.optional-dependencies]
# 若只装运行时依赖，pyspark/pandas/numpy 都已在 dependencies 里，无需 extra。
# 这里保留 dev 用于开发测试。
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
"Homepage" = "https://github.com/vicTop-cw/vools"
"Repository" = "https://github.com/vicTop-cw/vools"
"Issues" = "https://github.com/vicTop-cw/vools/issues"

# ============ setuptools: 自动发现 vools 命名空间下的 pyk 包 ============
[tool.setuptools.packages.find]
include = ["vools.pyk*"]

[tool.setuptools.package-data]
"vools.pyk" = [
    "README.md",
    "*/README.md",
]