[package]
name = "voxc"
version = "0.1.0"
edition = "2021"
description = "Vox language compiler backend (Rust)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
regex = "1"

[[bin]]
name = "voxc"
path = "src/main.rs"