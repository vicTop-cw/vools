name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/test_clipboard_debug.py --ignore=tests/test_clipboard_direct.py --ignore=tests/test_clipboard_event_loss.py --ignore=tests/test_clipboard_monitor.py --ignore=tests/test_clipboard_simple.py --ignore=tests/test_clipboard_single.py --ignore=tests/test_file_observer_integration.py --ignore=tests/test_folder_observer_integration.py --ignore=tests/test_key_observer_integration.py --ignore=tests/test_keyboard_observer_integration.py --ignore=tests/test_mouse_observer_integration.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 vools/ --max-line-length=120

  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run coverage
        run: |
          python -m pytest tests/ --cov=vools --cov-report=term-missing --ignore=tests/test_clipboard_debug.py --ignore=tests/test_clipboard_direct.py --ignore=tests/test_clipboard_event_loss.py --ignore=tests/test_clipboard_monitor.py --ignore=tests/test_clipboard_simple.py --ignore=tests/test_clipboard_single.py --ignore=tests/test_file_observer_integration.py --ignore=tests/test_folder_observer_integration.py --ignore=tests/test_key_observer_integration.py --ignore=tests/test_keyboard_observer_integration.py --ignore=tests/test_mouse_observer_integration.py