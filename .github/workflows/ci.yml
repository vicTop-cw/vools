name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # 手动触发：用于"全量耗时守卫"（跑完整 --fast 子集，约 100s）这类按需检查，
  # 不在每个 PR 上付这笔成本。
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd bridges
          python -m pytest tests/test_md_bridge.py -v --cov=vools.bridge.md --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: bridges/coverage.xml

  test-actus:
    runs-on: ubuntu-latest
    # 全量套件（含 305 条 `slow`）本机实测 ~205s；CI 机器更慢 + 6 个 Python 版本
    # + coverage 开销 ⇒ 给 25 分钟上限（默认 360 分钟太长，卡死时不会及时暴露）。
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # actus 测试自包含：tests/_ai_local_bootstrap.py 与 test_silent_import_bugs.py
          # 把本地源码树（仓库根 vools/ + actus/vools/ + bridges/）装进命名空间，
          # 不依赖已发布的 vools / vools-bridges wheel，因此只需 pytest 全家桶。

      - name: Run tests（**全量，不加 -m 过滤**）
        working-directory: ./actus
        # 本作业是 actus 的**唯一全量门禁**：必须跑完所有测试（含 305 条 `slow`：
        # 真实 probe / 真实执行 / TLS / 71 命令扫描）。**禁止**给它加 `-m "not slow"` ——
        # 那会让 305 条真实交互测试在本作业里永不执行，覆盖率也会掉。
        # 快跑子集（`-m "not slow"`）只属于 `guards` 作业。
        #
        # --cov-fail-under 覆盖 pyproject 的 fail_under=80（实测总覆盖率 ~29%）：
        # 阈值取下取整 28，保守防 CI 红，随覆盖率提升同步上调。
        run: python -m pytest -v --cov=vools.actus --cov-report=term-missing --cov-report=xml --cov-fail-under=28

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: actus-coverage-${{ matrix.python-version }}
          path: actus/coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy ruff==0.17.0

      - name: Lint
        run: |
          cd bridges
          flake8 vools/bridge/md/
          black --check vools/bridge/md/
          mypy vools/bridge/md/

      - name: Ruff (vools-actus)
        # 2026-10-21：vools-actus 的 ruff 基线。配置在 actus/pyproject.toml
        # （[tool.ruff]：E4/E7/E9 硬错误集 + 5 条风格 ignore，ruff 0.17.0 实测 0 违规）。
        # 注意：ruff 配置发现从 actus/ 上溯会停在 actus/pyproject.toml
        # （project_root=actus/），故配置必须放 actus 子项目而非仓库根。
        working-directory: ./actus
        run: ruff check vools/actus tests/

  guards:
    # 13 轮审计挖出 17 个「假的保护」，多数只靠"人记得"维护：
    # AST 扫描器写好没接 CI、desktop 修好没 smoke、只读契约没守卫。
    # 本 job 把它们钉进每个 PR：
    #   * 只读契约（pytest 3 个测试文件）—— **门禁**，退步必须红；
    #   * 只读命名扫描 / desktop smoke / CI 自检 —— **告警级**（continue-on-error），
    #     只写 Job Summary，不阻塞合并。
    #
    # 审计脚本现已迁到 **`actus/tools/audit/`**（被 git 跟踪）。
    # 背景：原先在 `actus/build/audit/`，而 `.gitignore` 有 `build/` —— 57 个脚本
    # **0 个入库**，"可复跑的证据"实际不可复现，CI 守卫也只能是盲的。
    # 现在脚本入库，AST 扫描是**真守卫**（脚本缺失会明确报错到 Summary）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 只读契约只需 pytest；desktop smoke 需要 fastapi/uvicorn/jinja2 + httpx(TestClient)；
          # keyring 是 vault2 的可选依赖（装上更接近真实用户环境）。
          pip install pytest fastapi uvicorn jinja2 httpx keyring

      # ── 门禁（唯一不 continue-on-error 的新增步骤）──
      - name: Read-only contracts（读路径零写，**不加 -m 过滤**）
        working-directory: ./actus
        # 这三份是「只读契约」的实测守卫：MCP tools/list 零写、CLI info/search 零写、
        # vault 读路径零写、omega 账本只追加不改写。退步 = 前几轮的修复被推翻。
        #
        # ⚠️ **为什么这里不能加 `-m "not slow"`**（第 23 轮实测计数）：
        #   test_vault_readonly_contracts.py  13 条 —— **全部是 slow**
        #   test_cli_no_side_effects.py       20 条 —— **全部是 slow**
        #   test_registry_omega_contracts.py  30 条 —— 全 fast
        # 过滤后只剩 30 条，**另外 33 条（也就是这道门禁真正要守的两份）会被静默跳过**，
        # 而且 pytest 会因为"有测试被 collect 到但被 deselect"而**照样退出 0** ——
        # 门禁形同虚设且无人察觉。全量跑这 3 份本机 **~34-39s**，作为 PR 门禁完全可接受。
        # （快跑子集属于 `test-actus` 之外的价值，见 guards 里那条可选的 fast-suite 步骤。）
        run: |
          set -o pipefail
          python -m pytest -q --durations=0 tests/test_vault_readonly_contracts.py \
                              tests/test_cli_no_side_effects.py \
                              tests/test_registry_omega_contracts.py \
            | tee gate-durations.txt

      # ── 告警级：快跑子集（`-m "not slow"`，~100s）整体冒烟 ──
      - name: Fast suite smoke（advisory，`-m "not slow"`）
        continue-on-error: true
        working-directory: ./actus
        # guards 的定位是"PR 快速反馈"：这里跑**排除 slow 的整个套件**（本机 ~100s），
        # 覆盖 967 条测试。全量（含 305 条 slow）仍由 test-actus 负责。
        run: |
          python -m pytest -q -m "not slow" --durations=0 tests \
            | tee fast-suite.txt
          {
            echo
            echo "### Fast suite（\`-m \"not slow\"\`，告警级）"
            echo '```'
            tail -3 fast-suite.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 告警级：耗时退化守卫（解析上一步的 --durations 输出，**零额外成本**）──
      - name: Test duration regression（advisory，零额外成本）
        continue-on-error: true
        working-directory: ./actus
        # 用 `--from-file` 复用上面已产生的 durations 输出，**不重复跑测试**（成本 0）。
        # 只在 workflow_dispatch 时额外跑一次完整 --fast 对比（~100s，按需）。
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          { echo; echo "### 测试耗时守卫（**告警级**）"; echo; } >> "$summary"
          if [ -f gate-durations.txt ]; then
            python tools/audit/check_test_duration.py --from-file gate-durations.txt \
              > duration-gate.txt 2>&1 || true
            echo "- 门禁 3 份文件的耗时对比：" >> "$summary"
            { echo '```'; tail -15 duration-gate.txt; echo '```'; } >> "$summary"
          else
            echo "- ⚠️ 没有 gate-durations.txt（门禁步骤未产出），跳过" >> "$summary"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- 手动触发：额外跑完整 \`--fast\` 耗时对比（~100s）" >> "$summary"
            python tools/audit/check_test_duration.py --fast > duration-full.txt 2>&1 || true
            { echo '```'; tail -15 duration-full.txt; echo '```'; } >> "$summary"
          fi

      # ── 告警级：desktop smoke（13 轮"首页 500 / 运行端点 500"的回归守卫）──
      - name: Desktop smoke（advisory，内联）
        continue-on-error: true
        working-directory: ./actus
        run: |
          python - <<'PY' 2>&1 | tee desktop-smoke.txt
          import os, sys, tempfile
          sys.path.insert(0, os.getcwd())
          sb = tempfile.mkdtemp(prefix='desktop-smoke-')
          os.environ.setdefault('ACTUS_META_DIR', os.path.join(sb, '_meta'))
          os.environ.setdefault('HOME', sb); os.environ.setdefault('USERPROFILE', sb)
          os.makedirs(os.environ['ACTUS_META_DIR'], exist_ok=True)
          from fastapi.testclient import TestClient
          from vools.actus import desktop
          from vools.actus.indexer import load_index
          ok, bad = [], []
          def chk(label, cond, detail=''):
              (ok if cond else bad).append('%s %s%s' % ('PASS' if cond else 'FAIL', label, (': ' + detail) if detail else ''))
              print((ok if cond else bad)[-1])
          try:
              idx = load_index(); ids = [a for a in (idx.get('actions') or {}) if not a.startswith('_invalid:')]
              chk('build index', True, 'count=%d' % len(ids))
          except Exception as exc:
              ids = []; chk('build index', False, '%s: %s' % (type(exc).__name__, exc))
          c = TestClient(desktop.app, raise_server_exceptions=False)
          r = c.get('/'); chk('GET / 200', r.status_code == 200, 'status=%d' % r.status_code)
          r = c.get('/api/actions'); chk('GET /api/actions 200', r.status_code == 200, 'status=%d' % r.status_code)
          probe = ids[0] if ids else None
          if probe:
              r = c.get('/api/actions/' + probe)
              chk('GET /api/actions/<id> 无 500', r.status_code != 500, 'status=%d' % r.status_code)
          r = c.post('/api/actions/__smoke_missing__/run', json={'params': {}})
          chk('POST run(<missing>) 无 500', r.status_code != 500, 'status=%d' % r.status_code)
          print('SUMMARY: %d passed, %d failed' % (len(ok), len(bad)))
          sys.exit(1 if bad else 0)
          PY
          {
            echo
            echo "### desktop smoke（**告警级**）"
            echo '```'
            tail -12 desktop-smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 告警级：只读命名 vs 写副作用（AST 扫描，依赖可能未入库的脚本）──
      - name: Audit readonly-named functions with write side effects（advisory）
        continue-on-error: true
        working-directory: ./actus
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          { echo; echo "### 只读命名 vs 写副作用（**告警级**）"; echo; } >> "$summary"
          scanner="tools/audit/readonly_name_writes.py"
          renderer="tools/audit/ci_readonly_summary.py"
          # 脚本已入库（tools/ 不被忽略）：缺失属于**真回归**，明确报出来
          if [ ! -f "$scanner" ] || [ ! -f "$renderer" ]; then
            echo "- ❌ 审计脚本缺失（\`$scanner\` / \`$renderer\`）—— 它们本应在仓库里。" >> "$summary"
            echo "- 后果：**本守卫失效**。请检查是否被误删/误移到被忽略目录。" >> "$summary"
            exit 1
          fi
          python "$scanner" --depth 3 --json readonly-writes.json | tee readonly-writes.txt || true
          python "$renderer" readonly-writes.json >> "$summary" || true
          # 已知局限（误报来源）见扫描器 docstring：kwarg 常量关闭写、三方库按名字
          # 归类、动态分派/反射、只覆盖 vools/actus/。**告警不是门禁**，别为清零放宽检测。

      # ── 告警级：CI 自检（test-actus / ruff 钉 / YAML / 矩阵 vs requires-python）──
      - name: CI self-guard（advisory）
        continue-on-error: true
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          { echo; echo "### CI 自检（**告警级**）"; echo; } >> "$summary"
          if grep -q '^  test-actus:' .github/workflows/ci.yml; then
            echo "- ✅ \`test-actus\` 作业存在（actus 唯一 CI 覆盖）" >> "$summary"
          else
            echo "- ❌ \`test-actus\` 作业**缺失** —— actus 将失去全部 CI 覆盖" >> "$summary"
          fi
          if grep -q 'ruff==0.17.0' .github/workflows/ci.yml; then
            echo "- ✅ \`ruff==0.17.0\` 版本钉存在（可复现性）" >> "$summary"
          else
            echo "- ❌ \`ruff==0.17.0\` 版本钉被移除（可复现性受损）" >> "$summary"
          fi
          if python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml', encoding='utf-8'))" 2>/dev/null; then
            echo "- ✅ ci.yml YAML 可解析" >> "$summary"
          else
            echo "- ❌ ci.yml YAML **解析失败**" >> "$summary"
          fi
          if grep -q 'requires-python = ">=3.7"' actus/pyproject.toml 2>/dev/null; then
            echo "- ⚠️ 声明 \`requires-python >=3.7\`，但 CI 矩阵从 **3.8** 起：3.7 无覆盖" >> "$summary"
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          cd bridges
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bridges/dist
          password: ${{ secrets.PYPI_TOKEN }}
