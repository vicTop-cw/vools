name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd bridges
          python -m pytest tests/test_md_bridge.py -v --cov=vools.bridge.md --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: bridges/coverage.xml

  test-actus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # actus 测试自包含：tests/_ai_local_bootstrap.py 与 test_silent_import_bugs.py
          # 把本地源码树（仓库根 vools/ + actus/vools/ + bridges/）装进命名空间，
          # 不依赖已发布的 vools / vools-bridges wheel，因此只需 pytest 全家桶。

      - name: Run tests
        working-directory: ./actus
        # --cov-fail-under 覆盖 pyproject 的 fail_under=80（2026-10-21 实测全量
        # 306 测试通过、总覆盖率 28.95%）：阈值取实测下取整 28，保守防 CI 红，
        # 随覆盖率提升同步上调。
        run: python -m pytest -v --cov=vools.actus --cov-report=term-missing --cov-report=xml --cov-fail-under=28

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: actus-coverage-${{ matrix.python-version }}
          path: actus/coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy ruff==0.17.0

      - name: Lint
        run: |
          cd bridges
          flake8 vools/bridge/md/
          black --check vools/bridge/md/
          mypy vools/bridge/md/

      - name: Ruff (vools-actus)
        # 2026-10-21：vools-actus 的 ruff 基线。配置在 actus/pyproject.toml
        # （[tool.ruff]：E4/E7/E9 硬错误集 + 5 条风格 ignore，ruff 0.17.0 实测 0 违规）。
        # 注意：ruff 配置发现从 actus/ 上溯会停在 actus/pyproject.toml
        # （project_root=actus/），故配置必须放 actus 子项目而非仓库根。
        working-directory: ./actus
        run: ruff check vools/actus tests/

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          cd bridges
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bridges/dist
          password: ${{ secrets.PYPI_TOKEN }}
