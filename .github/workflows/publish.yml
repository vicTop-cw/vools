name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vools
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build vools core package
        run: python -m build

      - name: Build vools-bridges package
        working-directory: ./bridges
        run: python -m build

      - name: Build vools-rx package
        working-directory: ./rx
        run: python -m build

      - name: Build vools-dll32 package
        working-directory: ./dll32
        run: python -m build

      - name: Build vools-xl package
        working-directory: ./xl
        run: python -m build

      - name: Publish vools core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish vools-bridges to PyPI
        if: always()
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bridges/dist/
          skip-existing: true

      - name: Publish vools-rx to PyPI
        if: always()
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: rx/dist/
          skip-existing: true

      - name: Publish vools-dll32 to PyPI
        if: always()
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dll32/dist/
          skip-existing: true

      - name: Publish vools-xl to PyPI
        if: always()
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: xl/dist/
          skip-existing: true
