[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vools-rhop"
version = "0.9.0"
authors = [
    { name = "Victor", email = "victortop921129@gmail.com" },
]
description = "vools-rhop - 双方对等镜像任务中继协议（密钥抽象 + 传输 + A/B/C 三角 + 通用任务队列：A 加密 JSON 指令 → B 解密执行，SQLite 管理依赖与状态）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"
dependencies = [
    "cryptography>=3.4",
    # envelope.py 在导入期就用 attr.s（Py3.6 基线不引入 dataclasses），此前漏声明
    "attrs>=17.0",
    # **vools 主包是硬依赖，此前漏声明** —— 装完必然 ImportError：
    #   · envelope.py:17 / task/models.py:261 → vools.core.dataclass_compat
    #   · crypto.py:25                        → vools.data.vtext
    #   · task/models.py:314                  → vools.data.vlist
    # 前两处在**模块级**导入，不是可选依赖。
    "vools>=0.9.0",
]

[project.optional-dependencies]
# watch.py 需要 vools.reactive.monitoring.file_watcher，而 reactive 在**另一个
# 发行包** vools-rx 里（vools 主包只提供懒加载与安装提示）。缺它时
# `rhop.watch` 会给出可读的降级提示，故列为可选。
watch = ["vools-rx>=0.7.6"]

[project.scripts]
rhop-task = "vools.rhop.task.cli:main"
rhop-secret = "vools.rhop.secret:main"

[tool.setuptools.packages.find]
include = ["vools.rhop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
